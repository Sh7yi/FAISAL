# Builds two and a half years of "smart money" history for the strategy lab:
#  - insider buys from the SEC's official Form 3/4/5 data sets (open-market
#    purchases by directors and officers, without pre-planned 10b5-1 trades),
#    grouped into "cluster" buys (2+ insiders within 10 days, $100k+) and
#    "big" buys (one insider, $250k+);
#  - new Schedule 13D filings (someone crossing 5% with plans for the company),
#    from EDGAR's quarterly form index.
# The file goes to the "research" branch, which the site reads.
name: Smart money history
on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smart-history
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Build the history
        run: |
          mkdir -p out
          python3 - <<'PY'
          import csv, io, json, re, sys, time, zipfile, datetime, urllib.request, collections
          csv.field_size_limit(sys.maxsize)
          UA = 'HalalSwing personal research (admin@5brgold.com)'
          def get(url, tries=4):
              err = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
                      with urllib.request.urlopen(req, timeout=180) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          raise
                      err = e
                  except Exception as e:
                      err = e
                  time.sleep(4 * (i + 1))
              raise err
          today = datetime.date.today()
          quarters = []
          y, q = today.year, (today.month - 1) // 3 + 1
          for k in range(11):
              quarters.append((y, q))
              q -= 1
              if q == 0:
                  y, q = y - 1, 4
          start = (today - datetime.timedelta(days=900)).isoformat()

          def day(s):
              s = (s or '').strip()
              for f in ('%d-%b-%Y', '%Y-%m-%d', '%m/%d/%Y', '%Y%m%d'):
                  try:
                      return datetime.datetime.strptime(s[:11], f).date().isoformat()
                  except ValueError:
                      pass
              return None

          # Tickers for every SEC company number.
          tick = {}
          for row in json.loads(get('https://www.sec.gov/files/company_tickers.json')).values():
              tick.setdefault(int(row['cik_str']), str(row['ticker']).upper())
          print('tickers', len(tick))

          # ---- insider buys ----
          links = {}
          try:
              page = get('https://www.sec.gov/data-research/sec-markets-data/insider-transactions-data-sets').decode('utf-8', 'replace')
              for href in re.findall(r'href="([^"]*?(\d{4}q[1-4])_form345\.zip)"', page):
                  url = href[0] if href[0].startswith('http') else 'https://www.sec.gov' + href[0]
                  links[href[1]] = url
          except Exception as e:
              print('could not read the data-set page:', e)
          buys = []
          used = []
          for (yy, qq) in quarters:
              key = f'{yy}q{qq}'
              urls = [links[key]] if key in links else []
              urls += [f'https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{key}_form345.zip',
                       f'https://www.sec.gov/files/datastandardsinnovation/data/insider-transactions-data-sets/{key}_form345.zip',
                       f'https://www.sec.gov/files/dera/data/insider-transactions-data-sets/{key}_form345.zip']
              blob = None
              for u in urls:
                  try:
                      blob = get(u)
                      break
                  except Exception as e:
                      continue
              if not blob:
                  print('no data set for', key)
                  continue
              z = zipfile.ZipFile(io.BytesIO(blob))
              names = {n.upper().split('/')[-1]: n for n in z.namelist()}
              def rows(name):
                  with z.open(names[name]) as f:
                      r = csv.reader(io.TextIOWrapper(f, encoding='utf-8', errors='replace'), delimiter='\t', quoting=csv.QUOTE_NONE)
                      head = [h.strip().upper() for h in next(r)]
                      for line in r:
                          yield dict(zip(head, line))
              sub = {}
              for r in rows('SUBMISSION.TSV'):
                  if (r.get('DOCUMENT_TYPE') or '').strip() != '4':
                      continue
                  plan = (r.get('AFF10B5ONE') or '').strip().lower() in ('1', 'true', 'y', 'yes')
                  sym = (r.get('ISSUERTRADINGSYMBOL') or '').strip().upper()
                  try:
                      cik = int(r.get('ISSUERCIK') or 0)
                  except ValueError:
                      cik = 0
                  sym = tick.get(cik, sym)
                  sub[r['ACCESSION_NUMBER']] = (day(r.get('FILING_DATE')), sym, plan)
              own = {}
              for r in rows('REPORTINGOWNER.TSV'):
                  acc = r['ACCESSION_NUMBER']
                  if acc in own:
                      continue
                  rel = (r.get('RPTOWNER_RELATIONSHIP') or '').lower()
                  own[acc] = (r.get('RPTOWNERCIK') or '', 'director' in rel or 'officer' in rel, (r.get('RPTOWNER_TITLE') or '').strip())
              value = collections.defaultdict(float)
              plan_note = set()
              for r in rows('NONDERIV_TRANS.TSV'):
                  acc = r['ACCESSION_NUMBER']
                  if acc not in sub or (r.get('TRANS_CODE') or '').strip() != 'P' or (r.get('TRANS_ACQUIRED_DISP_CD') or '').strip() != 'A':
                      continue
                  try:
                      value[acc] += float(r.get('TRANS_SHARES') or 0) * float(r.get('TRANS_PRICEPERSHARE') or 0)
                  except ValueError:
                      pass
              n0 = len(buys)
              for acc, v in value.items():
                  date, sym, plan = sub[acc]
                  o = own.get(acc)
                  if not date or not sym or plan or not o or not o[1] or v < 10000 or date < start:
                      continue
                  buys.append({'symbol': sym, 'date': date, 'owner': o[0], 'title': o[2], 'value': round(v)})
              used.append(key)
              print(key, 'buys', len(buys) - n0)
          # Group into events, one per stock at most every 30 days per kind.
          events = []
          by = collections.defaultdict(list)
          for b in buys:
              by[b['symbol']].append(b)
          for sym, lst in by.items():
              lst.sort(key=lambda b: b['date'])
              last = {}
              for i, b in enumerate(lst):
                  d = datetime.date.fromisoformat(b['date'])
                  win = [x for x in lst[:i + 1] if (d - datetime.date.fromisoformat(x['date'])).days <= 10]
                  people = {x['owner'] for x in win}
                  total = sum(x['value'] for x in win)
                  def emit(kind, n, v):
                      prev = last.get(kind)
                      if prev and (d - prev).days < 30:
                          return
                      last[kind] = d
                      events.append({'symbol': sym, 'date': b['date'], 'kind': kind, 'insiders': n, 'value': round(v)})
                  if len(people) >= 2 and total >= 100000:
                      emit('cluster', len(people), total)
                  if b['value'] >= 250000:
                      emit('big', 1, b['value'])
          print('insider events', len(events))

          # ---- new Schedule 13D filings (5%+ holders with plans) ----
          seen = set()
          act = 0
          for (yy, qq) in quarters:
              try:
                  idx = get(f'https://www.sec.gov/Archives/edgar/full-index/{yy}/QTR{qq}/form.idx').decode('latin-1')
              except Exception as e:
                  print('no form index for', yy, qq, e)
                  continue
              for line in idx.splitlines():
                  if not (line.startswith('SC 13D ') or line.startswith('SCHEDULE 13D ')):
                      continue
                  parts = re.split(r'\s{2,}', line.strip())
                  if len(parts) < 5:
                      continue
                  form, cik, date = parts[0], parts[-3], parts[-2]
                  if form not in ('SC 13D', 'SCHEDULE 13D'):
                      continue
                  try:
                      sym = tick.get(int(cik))
                  except ValueError:
                      sym = None
                  if not sym or date < start:
                      continue
                  # The same filing is listed under the company and the buyer: keep one per company per 30 days.
                  key = (sym, date[:7])
                  if key in seen:
                      continue
                  seen.add(key)
                  events.append({'symbol': sym, 'date': date, 'kind': 'activist'})
                  act += 1
              time.sleep(0.3)
          print('13D events', act)
          events.sort(key=lambda e: (e['date'], e['symbol']))
          json.dump({'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'from': start, 'quarters': used,
                     'buys': len(buys), 'events': events}, open('out/smart_history.json', 'w'), separators=(',', ':'))
          PY
          ls -la out
      - name: Publish to the research branch
        run: |
          cd out
          git init -q -b research
          git config user.name "smart-history"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Smart money history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" research
